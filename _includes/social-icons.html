<div class="social-icons">
    {% if site.author.github %}
    <a href="https://github.com/{{ site.author.github }}" aria-label="GitHub" target="_blank" rel="noopener noreferrer"><i class="fa fa-github" aria-hidden="true"></i></a>
    {% endif %}
    {% if site.author.twitter %}
    <a href="https://twitter.com/{{ site.author.twitter }}" aria-label="Twitter" target="_blank" rel="noopener noreferrer"><i class="fa fa-twitter" aria-hidden="true"></i></a>
    {% endif %}
    {% if site.author.linkedin %}
    <a href="https://linkedin.com/in/{{ site.author.linkedin }}" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer"><i class="fa fa-linkedin" aria-hidden="true"></i></a>
    {% endif %}
    {% if site.author.email %}
    <a href="mailto:{{ site.author.email }}" aria-label="E-mail"><i class="fa fa-envelope" aria-hidden="true"></i></a>
    {% endif %}
    <a href="{{ site.rss_path }}" aria-label="Flux RSS"><i class="fa fa-rss" aria-hidden="true"></i></a>
</div>
